[project]
name = "path-nninteractive"
version = "0.1.0"
description = "nnInteractive 3D segmentation along a drawn PATH"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "arkitekt[all]>=10.0.1",
    "dask[array]>=2026.8.0",
    "fabriks>=1.3.1",
    "mikro>=12.1.0",
    # Its torch is PyPI's, the CUDA 13 build: it brings its CUDA runtime and needs a host driver >= 580.
    "nninteractive>=2.6.0",
    "pint>=0.24",
    "scikit-image>=0.25",
    "scipy>=1.14",
    "xarray>=2026.9.0",
]

[build-system]
requires = ["uv_build>=0.12.23,<0.14"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "konstruktor>=0.34.1",
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
addopts = "-m 'not hub'"
markers = ["hub: needs a hub made for the tests (Docker and konstruktor)"]

[tool.semantic_release]
version_variables = ["app.py:__version__"]
commit_message = "chore(release): {version} [skip ci]"
tag_format = "v{version}"
allow_zero_version = true

[tool.semantic_release.branches.release]
match = "main"
prerelease = false
